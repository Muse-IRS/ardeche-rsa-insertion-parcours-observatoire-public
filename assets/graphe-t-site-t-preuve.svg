<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Graphe T_site et T_preuve — Capévol — 22 juillet au 4 octobre 2026</title><desc id="desc">Deux temporalités parallèles distinguent l'état réel du site Capévol de l'état des preuves disponibles. Quatre états sont représentés : 22 juillet, 25 septembre, 4 octobre T3a et 4 octobre T3b.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7faf8"/><stop offset="1" stop-color="#e5efe9"/></linearGradient><linearGradient id="site" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#173e30"/><stop offset="1" stop-color="#267453"/></linearGradient><linearGradient id="proof" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#446b5a"/><stop offset="1" stop-color="#6e9b85"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173e30" flood-opacity="0.15"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#267453"/></marker><marker id="arrowMuted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#6b8175"/></marker></defs><rect width="1600" height="1000" fill="url(#bg)"/><rect x="70" y="60" width="1460" height="880" rx="32" fill="#fff" stroke="#cbdcd3" filter="url(#shadow)"/><text x="120" y="125" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#267453" letter-spacing="2">MUZE-X V4 · OBSERVATOIRE RSA ARDÈCHE</text><text x="120" y="180" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#173e30">T_site ↔ T_preuve</text><text x="120" y="220" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#506a5c">Capévol · distinguer l'évolution du système de l'évolution de la connaissance sur le système</text><rect x="120" y="270" width="180" height="54" rx="27" fill="url(#site)"/><text x="210" y="305" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#fff">T_site</text><text x="330" y="305" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#173e30">État réel du site — partiellement observable, jamais assimilé à la seule preuve disponible</text><rect x="120" y="565" width="180" height="54" rx="27" fill="url(#proof)"/><text x="210" y="600" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#fff">T_preuve</text><text x="330" y="600" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#173e30">État documentaire et probatoire — évolue quand de nouvelles sources deviennent reproductibles</text><line x1="330" y1="430" x2="1420" y2="430" stroke="#267453" stroke-width="5" marker-end="url(#arrow)"/><line x1="330" y1="720" x2="1420" y2="720" stroke="#6b8175" stroke-width="5" marker-end="url(#arrowMuted)"/><g font-family="Arial, Helvetica, sans-serif"><rect x="330" y="350" width="245" height="150" rx="18" fill="#f3f8f5" stroke="#267453" stroke-width="2"/><text x="452" y="386" text-anchor="middle" font-size="22" font-weight="700" fill="#173e30">22/07/2026</text><text x="352" y="425" font-size="17" fill="#40584c"><tspan x="352">État réel non figé</tspan><tspan x="352" dy="25">par artefact complet.</tspan><tspan x="352" dy="25">Aucun changement daté.</tspan></text><rect x="610" y="350" width="245" height="150" rx="18" fill="#f3f8f5" stroke="#267453" stroke-width="2"/><text x="732" y="386" text-anchor="middle" font-size="22" font-weight="700" fill="#173e30">25/09/2026</text><text x="632" y="425" font-size="17" fill="#40584c"><tspan x="632">Site rendu observé</tspan><tspan x="632" dy="25">selon Perplexity.</tspan><tspan x="632" dy="25">Évolution réelle non datée.</tspan></text><rect x="890" y="350" width="245" height="150" rx="18" fill="#f3f8f5" stroke="#267453" stroke-width="2"/><text x="1012" y="386" text-anchor="middle" font-size="22" font-weight="700" fill="#173e30">04/10 · T3a</text><text x="912" y="425" font-size="17" fill="#40584c"><tspan x="912">Relecture publique.</tspan><tspan x="912" dy="25">Pas de changement</tspan><tspan x="912" dy="25">technique daté.</tspan></text><rect x="1170" y="350" width="245" height="150" rx="18" fill="#eef7f2" stroke="#173e30" stroke-width="3"/><text x="1292" y="386" text-anchor="middle" font-size="22" font-weight="700" fill="#173e30">04/10 · T3b</text><text x="1192" y="425" font-size="17" fill="#40584c"><tspan x="1192">Aucun changement du site</tspan><tspan x="1192" dy="25">démontré entre T3a et T3b.</tspan><tspan x="1192" dy="25">Le discriminant reste ouvert.</tspan></text></g><g font-family="Arial, Helvetica, sans-serif"><rect x="330" y="645" width="245" height="150" rx="18" fill="#f7faf8" stroke="#7b9587" stroke-width="2"/><text x="452" y="681" text-anchor="middle" font-size="22" font-weight="700" fill="#173e30">22/07/2026</text><text x="352" y="720" font-size="17" fill="#40584c"><tspan x="352">Audit documentaire</tspan><tspan x="352" dy="25">et extraits indexés.</tspan><tspan x="352" dy="25">Couverture limitée.</tspan></text><rect x="610" y="645" width="245" height="150" rx="18" fill="#f7faf8" stroke="#7b9587" stroke-width="2"/><text x="732" y="681" text-anchor="middle" font-size="22" font-weight="700" fill="#173e30">25/09/2026</text><text x="632" y="720" font-size="17" fill="#40584c"><tspan x="632">Perplexity rapporte</tspan><tspan x="632" dy="25">OVH/Lovable/Cloudflare/</tspan><tspan x="632" dy="25">Supabase + TLS/HSTS.</tspan></text><rect x="890" y="645" width="245" height="150" rx="18" fill="#f7faf8" stroke="#7b9587" stroke-width="2"/><text x="1012" y="681" text-anchor="middle" font-size="22" font-weight="700" fill="#173e30">04/10 · T3a</text><text x="912" y="720" font-size="17" fill="#40584c"><tspan x="912">Reproduction primaire</tspan><tspan x="912" dy="25">technique insuffisante.</tspan><tspan x="912" dy="25">UNKNOWN conservé.</tspan></text><rect x="1170" y="645" width="245" height="150" rx="18" fill="#edf6f1" stroke="#173e30" stroke-width="3"/><text x="1292" y="681" text-anchor="middle" font-size="22" font-weight="700" fill="#173e30">04/10 · T3b</text><text x="1192" y="720" font-size="17" fill="#40584c"><tspan x="1192">Lovable : déclaration</tspan><tspan x="1192" dy="25">first-party renforcée.</tspan><tspan x="1192" dy="25">Autres couches non reproduites.</tspan></text></g><g stroke="#9aafa4" stroke-width="2.5" stroke-dasharray="8 8" fill="none"><line x1="452" y1="500" x2="452" y2="645"/><line x1="732" y1="500" x2="732" y2="645"/><line x1="1012" y1="500" x2="1012" y2="645"/><line x1="1292" y1="500" x2="1292" y2="645"/></g><text x="1470" y="525" transform="rotate(90 1470 525)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6b8175">observation / inférence bornée ≠ identité</text><rect x="120" y="835" width="1360" height="70" rx="16" fill="#173e30"/><text x="800" y="865" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#fff">ÉVOLUTION(T_preuve) ≠ ÉVOLUTION(T_site)</text><text x="800" y="893" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#dce9e2">Une preuve nouvelle peut améliorer la connaissance sans démontrer une modification du site.</text><text x="120" y="930" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6b8175">Un socle, une posture · PAGE_PUBLIÉE ≠ CONFIGURATION_RÉELLE · SOURCE_SECONDAIRE ≠ CAPTURE_PRIMAIRE · UNKNOWN = RÉSULTAT_VALIDE</text></svg>